<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PaxFlow</title>
  
  <!-- PWA Manifest & Branding -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  
  <!-- iOS Safari PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PaxFlow">
  <link rel="apple-touch-icon" href="/logo.svg">

  <!-- Google Fonts Inter & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Container Principal do Aplicativo -->
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <!-- Script de Entrada Principal (Vite / TypeScript) -->
  <script type="module" src="/src/main.ts"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registrado com sucesso!', reg.scope))
          .catch((err) => console.warn('Falha ao registrar Service Worker:', err));
      });
    }
  </script>
</body>

</html>
